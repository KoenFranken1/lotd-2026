<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Left of the Dial 2026 — Your Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14120F;
    --bg-raised: #1C1913;
    --paper: #F1E9D8;
    --paper-dim: #B8AF9C;
    --line: #38332A;
    --accent: #E8B93E;
    --accent-ink: #14120F;
    --wed: #8B7FC7;
    --thu: #4E9788;
    --fri: #E8B93E;
    --sat: #D2593A;
    --danger: #F0472D;
    --success: #5CAB63;
    --danger-wash: rgba(240, 71, 45, 0.15);
    --accent-wash: rgba(232, 185, 62, 0.22);
    --paper-mid: #C9C0AC;
    --radius: 3px;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F1E9D8;
      --bg-raised: #E8DFC9;
      --paper: #201C15;
      --paper-dim: #6B6250;
      --line: #D8CCAE;
      --accent-ink: #F1E9D8;
      --paper-mid: #5C543F;
    }
  }
  :root[data-theme="light"] {
    --bg: #F1E9D8;
    --bg-raised: #E8DFC9;
    --paper: #201C15;
    --paper-dim: #6B6250;
    --line: #D8CCAE;
    --accent-ink: #F1E9D8;
    --paper-mid: #5C543F;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    height: 100%;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
  }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 18px 60px; }

  header.hero {
    padding: 28px 0 18px;
    border-bottom: 1px solid var(--line);
  }
  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .kicker {
    font-size: 13px;
    color: var(--paper-dim);
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  .header-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    font-family: inherit;
    font-size: 13px;
    background: none;
    border: 1px solid var(--line);
    color: var(--paper-dim);
    border-radius: var(--radius);
    padding: 6px 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 32px;
  }
  .icon-btn:hover { color: var(--paper); border-color: var(--paper-dim); }
  .icon-btn-label { font-size: 12px; font-weight: 600; }
  h1 {
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.05;
    margin: 0 0 10px;
  }
  .hero-sub {
    color: var(--paper-dim);
    font-size: 14px;
    line-height: 1.5;
    max-width: 46ch;
    margin: 0;
  }

  nav.main-tabs {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 6;
    display: flex;
    gap: 6px;
    padding: 14px 0 0;
    background: var(--bg);
  }
  .main-tab {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--paper);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 9px 14px;
    cursor: pointer;
    flex: 1 1 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }
  .main-tab .n {
    background: var(--bg);
    color: var(--paper-dim);
    font-weight: 700;
    font-size: 12px;
    padding: 1px 6px;
    border-radius: 10px;
  }
  .main-tab.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .main-tab.active .n { background: var(--accent-ink); color: var(--accent); }

  nav.days {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + 49px);
    z-index: 5;
    display: flex;
    gap: 6px;
    padding: 12px 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  .day-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--paper);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .day-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .day-btn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .day-btn.active .day-dot { box-shadow: 0 0 0 2px var(--accent-ink); }
  .day-btn .count { color: var(--paper-dim); font-weight: 400; }
  .day-btn.active .count { color: var(--accent-ink); opacity: 0.7; }

  .toolbar {
    display: flex;
    gap: 8px;
    padding: 14px 0;
    flex-wrap: wrap;
  }
  input[type="search"] {
    flex: 1 1 200px;
    font-family: inherit;
    font-size: 14px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: var(--radius);
    padding: 9px 12px;
  }
  input[type="search"]::placeholder { color: var(--paper-dim); }
  select {
    font-family: inherit;
    font-size: 14px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: var(--radius);
    padding: 9px 10px;
  }

  .list { margin-top: 8px; }
  .row {
    display: grid;
    grid-template-columns: 56px 1fr 44px;
    gap: 12px;
    align-items: start;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    border-left: 3px solid transparent;
    padding-left: 10px;
    cursor: pointer;
  }
  .row.starred { border-left-color: var(--success); }
  .row.clash { border-left-color: var(--danger); }
  .time { font-weight: 700; font-size: 15px; padding-top: 12px; font-variant-numeric: tabular-nums; }
  .info { padding: 4px 0; }
  .info .name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 16px; }

  .venue-line {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--paper-dim);
    margin-top: 4px;
  }
  .venue-pin { flex-shrink: 0; }
  .venue-name { color: var(--paper); font-weight: 500; }
  .venue-num-tag { color: var(--paper-dim); }
  .venue-sep { color: var(--line); }
  .cap-badge-text {
    font-size: 11px;
    font-weight: 600;
    color: var(--paper-dim);
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1px 8px;
  }

  .genre-line { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .genre-pill {
    font-size: 11px;
    font-weight: 600;
    color: var(--paper-dim);
    background: var(--bg-raised);
    border-radius: 10px;
    padding: 2px 8px;
  }
  .show-count { font-size: 12px; color: var(--paper-dim); font-style: italic; }

  .fans { font-size: 13px; margin-top: 6px; line-height: 1.5; color: var(--paper-mid); }
  .fans b { font-weight: 600; color: var(--paper); }
  .clash-note { font-size: 12.5px; color: var(--danger); margin-top: 6px; display: none; }
  .row.clash .clash-note { display: block; }

  .remove-pick-btn {
    display: none;
    margin-top: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 5px 10px;
    cursor: pointer;
  }
  .row.open .remove-pick-btn { display: inline-block; }

  .star-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    color: var(--paper-dim);
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin-top: 2px;
  }
  .row.starred .star-btn { color: var(--paper); }
  .row.must .star-btn { color: var(--accent); font-size: 23px; }

  .day-heading {
    font-size: 13px;
    font-weight: 600;
    color: var(--paper-dim);
    margin: 22px 0 4px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .day-heading:first-child { margin-top: 8px; }

  .empty {
    padding: 50px 10px;
    text-align: center;
    color: var(--paper-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  footer {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--paper-dim);
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .reset-btn {
    background: none;
    border: none;
    color: var(--paper-dim);
    text-decoration: underline;
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
    padding: 0;
  }

  @media (max-width: 420px) {
    .row { grid-template-columns: 46px 1fr 44px; gap: 9px; }
    .main-tab { padding: 8px 8px; font-size: 12.5px; }
    .icon-btn-label { display: none; }
    .toolbar { gap: 7px; }
    .clash-venue-col { width: 84px; }
    .clash-venue-label { font-size: 10.5px; }
  }

  .venues-view { margin-top: 8px; }
  .venue-map-wrap { overflow-x: auto; margin-bottom: 14px; }
  .venue-map-wrap svg { display: block; width: 100%; height: auto; min-width: 320px; }
  .venue-note { font-size: 12.5px; color: var(--paper-dim); line-height: 1.5; margin: 0 0 16px; }
  .venue-table-wrap { overflow-x: auto; }
  table.venue-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.venue-table th, table.venue-table td {
    text-align: left;
    padding: 7px 8px;
    border-bottom: 1px solid var(--line);
  }
  table.venue-table th { color: var(--paper-dim); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
  table.venue-table td.vt-num { color: var(--paper-dim); }
  table.venue-table td.vt-name { font-weight: 600; white-space: nowrap; }
  tr.venue-table-row { cursor: pointer; }
  tr.venue-table-row:hover { background: var(--bg-raised); }

  .venue-map .venue-node { cursor: pointer; }
  .venue-map .venue-node:hover circle { stroke: var(--accent); }
  .venue-map .venue-node:focus circle { stroke: var(--accent); outline: none; }

  .venue-legend {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--paper-dim);
    margin: 10px 0 16px;
  }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .ticket-desk-dot { background: var(--accent); }

  .venue-detail-hint { font-size: 13px; color: var(--paper-dim); line-height: 1.5; margin: 0 0 18px; }
  .venue-detail {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 18px;
  }
  .vd-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .vd-name-big { font-weight: 700; font-size: 16px; }
  .vd-walk { font-size: 12.5px; color: var(--paper-dim); margin-top: 4px; }
  .vd-acts { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
  .vd-act { display: flex; gap: 8px; font-size: 13px; align-items: baseline; }
  .vd-day { color: var(--paper-dim); font-size: 11px; font-weight: 600; width: 30px; flex-shrink: 0; }
  .vd-time { font-weight: 600; font-variant-numeric: tabular-nums; width: 40px; flex-shrink: 0; }
  .vd-name { color: var(--paper); }
  .vd-empty { font-size: 12.5px; color: var(--paper-dim); margin-top: 8px; }

  .clash-view { margin-top: 8px; }
  .clash-day { margin-bottom: 30px; }
  .clash-day-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .clash-day-body { display: flex; }
  .clash-venue-col { width: 108px; flex-shrink: 0; position: relative; }
  .clash-venue-label {
    position: absolute;
    left: 0;
    right: 8px;
    display: flex;
    align-items: center;
    font-size: 11.5px;
    color: var(--paper-dim);
    line-height: 1.25;
  }
  .clash-timeline-wrap { flex: 1; overflow-x: auto; }
  .clash-timeline { position: relative; min-width: 320px; }
  .clash-row-bg { position: absolute; left: 0; right: 0; background: var(--bg-raised); }
  .clash-row-bg.alt { background: transparent; }
  .clash-hourline { position: absolute; width: 1px; background: var(--line); }
  .clash-hourlabel { position: absolute; top: 2px; font-size: 10px; color: var(--paper-dim); transform: translateX(3px); }
  .clash-band { position: absolute; background: var(--danger-wash); pointer-events: none; }
  .clash-block {
    position: absolute;
    border-radius: 3px;
    background: var(--bg-raised);
    border: 1.5px solid var(--success);
    padding: 3px 6px;
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.2;
  }
  .clash-block.must { background: var(--accent-wash); border-width: 2.5px; }
  .clash-block.clash { border-color: var(--danger); }
  .clash-block.selected { box-shadow: 0 0 0 2px var(--paper); }
  .clash-block .cb-time { font-size: 10px; font-weight: 700; color: var(--success); white-space: nowrap; }
  .clash-block.clash .cb-time { color: var(--danger); }
  .clash-block .cb-name { font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clash-note { font-size: 12.5px; color: var(--paper-dim); line-height: 1.5; margin: 0 0 16px; }

  .clash-popover {
    position: fixed;
    z-index: 50;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    width: min(340px, calc(100vw - 32px));
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  }
  .clash-popover[hidden] { display: none; }
  .clash-popover-close {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    color: var(--paper-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }
  .cd-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 20px; }
  .cd-name-big { font-weight: 700; font-size: 16px; }
  .cd-meta { font-size: 12.5px; color: var(--paper-dim); margin-top: 4px; }
  .cd-clash-note { font-size: 12.5px; color: var(--danger); margin-top: 8px; }
  .cd-remove-btn {
    margin-top: 12px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: var(--radius);
    padding: 6px 12px;
    cursor: pointer;
  }

  .share-view { margin-top: 8px; }
  .share-block { margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .share-block:last-child { border-bottom: none; }
  .share-block h3 { font-size: 14px; margin: 0 0 6px; }
  .share-note { font-size: 12.5px; color: var(--paper-dim); line-height: 1.5; margin: 0 0 12px; }
  .share-url-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .share-url-row input[type="text"] {
    flex: 1 1 180px;
    min-width: 0;
    font-family: inherit;
    font-size: 12px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    color: var(--paper);
    border-radius: var(--radius);
    padding: 9px 10px;
  }
  .share-copy-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: var(--radius);
    padding: 9px 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* ---------- Schedule layout toggle (List / Timetable) ---------- */
  .wrap { transition: max-width 0.2s ease; }
  .wrap.wide { max-width: 1180px; }
  .layout-toggle {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    flex-shrink: 0;
  }
  .layout-toggle button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    background: var(--bg-raised);
    color: var(--paper-dim);
    border: none;
    padding: 8px 12px;
    cursor: pointer;
  }
  .layout-toggle button + button { border-left: 1px solid var(--line); }
  .layout-toggle button.active { background: var(--paper); color: var(--bg); }

  /* ---------- Timetable grid ---------- */
  .tt-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--paper-dim);
    margin: 0 0 8px;
  }
  .tt-legend { display: flex; gap: 12px; flex-wrap: wrap; }
  .tt-legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    vertical-align: -1px; margin-right: 4px; border: 1.5px solid var(--line);
  }
  .tt-legend .lg-want { border-color: var(--paper); }
  .tt-legend .lg-must { background: var(--accent); border-color: var(--accent); }
  .tt-legend .lg-clash { border-color: var(--danger); }
  .tt-scroll {
    overflow: auto;
    max-height: calc(100vh - 130px);
    max-height: calc(100dvh - 130px);
    min-height: 320px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }
  .tt { position: relative; }
  .tt-head {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    background: var(--bg);
    border-bottom: 2px solid var(--tt-day, var(--accent));
  }
  .tt-corner {
    position: sticky;
    left: 0;
    z-index: 4;
    flex-shrink: 0;
    background: var(--bg);
    border-right: 1px solid var(--line);
  }
  .tt-venue {
    flex-shrink: 0;
    padding: 8px 8px 7px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2px;
    min-height: 46px;
  }
  .tt-venue-name { font-size: 11.5px; font-weight: 700; line-height: 1.2; }
  .tt-venue-num { font-size: 10px; color: var(--paper-dim); font-weight: 600; }
  .tt-body { display: flex; position: relative; }
  .tt-times {
    position: sticky;
    left: 0;
    z-index: 2;
    flex-shrink: 0;
    background: var(--bg);
    border-right: 1px solid var(--line);
  }
  .tt-hour {
    position: absolute;
    left: 0;
    right: 6px;
    text-align: right;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--paper-dim);
    font-variant-numeric: tabular-nums;
    transform: translateY(3px);
  }
  .tt-canvas {
    position: relative;
    flex-shrink: 0;
    background-image:
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--tt-hour)),
      repeating-linear-gradient(to bottom, transparent 0 calc(var(--tt-hour) / 2), rgba(127,127,127,0.12) calc(var(--tt-hour) / 2) calc(var(--tt-hour) / 2 + 1px), transparent calc(var(--tt-hour) / 2 + 1px) var(--tt-hour)),
      repeating-linear-gradient(to right, transparent 0 calc(var(--tt-col) - 1px), var(--line) calc(var(--tt-col) - 1px) var(--tt-col));
  }
  .tt-block {
    position: absolute;
    border-radius: 3px;
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-left: 3px solid var(--tt-day, var(--accent));
    padding: 4px 6px;
    overflow: hidden;
    cursor: pointer;
    line-height: 1.2;
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease;
  }
  .tt-block:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.25); z-index: 1; }
  .tt-block:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  };

  const VENUE_ALIAS = {
    "ANNABEL DOWN": "ANNABEL", "ANNABEL UP": "ANNABEL", "ANNEBEL UP": "ANNABEL",
    "TR UP": "THEATER ROTTERDAM", "TR DOWN": "THEATER ROTTERDAM", "TR FOYER": "THEATER ROTTERDAM",
    "WORM 1": "WORM", "WORM 2": "WORM"
  };

  // A few venues share one VENUE_INFO entry but have distinct sub-rooms —
  // this keeps that distinction visible in the display name instead of
  // collapsing "TR UP" and "TR DOWN" into the same generic label.
  const VENUE_ROOM_SUFFIX = {
    "ANNABEL DOWN": "Down", "ANNABEL UP": "Up", "ANNEBEL UP": "Up",
    "TR UP": "Up", "TR DOWN": "Down", "TR FOYER": "Foyer",
    "WORM 1": "Room 1", "WORM 2": "Room 2"
  };

  const DARK_MAP_COLORS = { bg: '#1C1913', dot: '#F1E9D8', dotFill: 'rgba(241,233,216,0.16)', accent: '#E8B93E', textDim: '#B8AF9C' };
  const LIGHT_MAP_COLORS = { bg: '#F4F1EA', dot: '#181614', dotFill: 'rgba(24,22,20,0.08)', accent: '#B0301A', textDim: '#666' };

  const STORAGE_KEY = 'lotd2026_picks';
  const LAYOUT_KEY = 'lotd2026_layout';
  const BACKUP_KEY = 'lotd2026_backups';

  /* ============================================================
     2. UTILITY FUNCTIONS (Geo / Math / Formatting)
     ============================================================ */

  const escapeHtml = (s) =>
    (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const toMinutes = (t) => {
    const [hStr, mStr] = t.split(':');
    let h = parseInt(hStr, 10);
    const m = parseInt(mStr, 10);
    // Times like 0:10 after midnight belong to the tail end of that day's schedule
    if (h < 4) h += 24;
    return h * 60 + m;
  };

  const geoDist = (a, b) => {
    const lonScale = Math.cos((a.lat + b.lat) / 2 * Math.PI / 180);
    const dx = (a.lon - b.lon) * lonScale;
    const dy = a.lat - b.lat;
    return Math.sqrt(dx * dx + dy * dy);
  };

  // Number venues by real proximity, swept top-to-bottom: seed at the
  // northernmost venue as #1, then always number whichever unvisited
  // venue is closest to the last one numbered. This keeps nearby venues
  // numbered close together and pushes #1 and #22 to genuinely opposite
  // ends of the map, instead of looping back near the start.
  function computeWalkOrder() {
    const keys = Object.keys(VENUE_INFO);
    const startKey = keys.reduce(
      (best, k) => (VENUE_INFO[k].lat > VENUE_INFO[best].lat ? k : best),
      keys[0]
    );
    const remaining = keys.filter((k) => k !== startKey);
    VENUE_INFO[startKey].order = 1;
    let current = VENUE_INFO[startKey];
    let n = 2;
    while (remaining.length) {
      let bestIdx = 0;
      let bestDist = Infinity;
      for (let i = 0; i < remaining.length; i++) {
        const d = geoDist(current, VENUE_INFO[remaining[i]]);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      const key = remaining[bestIdx];
      VENUE_INFO[key].order = n++;
      current = VENUE_INFO[key];
      remaining.splice(bestIdx, 1);
    }
  }
  computeWalkOrder();

  function venueInfoFor(showVenue) {
    const key = VENUE_ALIAS[showVenue] || showVenue;
    return VENUE_INFO[key] || null;
  }

  function venueKeyFor(showVenue) {
    return VENUE_ALIAS[showVenue] || showVenue;
  }

  function venueDisplayName(showVenue, info) {
    if (!info) return showVenue;
    const suffix = VENUE_ROOM_SUFFIX[showVenue];
    return suffix ? `${info.name} (${suffix})` : info.name;
  }

  const capLabel = (cap) =>
    cap === 3 ? 'Large capacity' : cap === 2 ? 'Medium capacity' : 'Small capacity';

  const capShortLabel = (cap) =>
    cap === 3 ? 'Large Cap' : cap === 2 ? 'Mid Cap' : 'Small Cap';

  // "alt-rave" -> "Alt-rave", "indie rock" -> "Indie rock" — sentence case
  // per tag, since these read as short labels rather than titles.
  const titleCaseGenreTag = (g) => g.charAt(0).toUpperCase() + g.slice(1);

  function genrePillsHTML(genre) {
    if (!genre) return '';
    return genre.split('/')
      .map((g) => g.trim())
      .filter(Boolean)
      .map((g) => `<span class="genre-pill">${escapeHtml(titleCaseGenreTag(g))}</span>`)
      .join('');
  }

  // A show marked as plan B never counts as a clash — on either side —
  // so resolving a clash is just "pick which one is the backup".
  function findClash(entry, dayPicks) {
    if (isBackup(entry)) return null;
    for (const other of dayPicks) {
      if (other.id === entry.id) continue;
      if (isBackup(other)) continue;
      if (Math.abs(other.mins - entry.mins) < SET_MINUTES) return other;
    }
    return null;
  }

  // Every overlapping pick, ignoring plan-B status (used to explain what a
  // backup is a backup *for*, and to swap plan A / plan B).
  function overlappingPicks(entry, dayPicks) {
    return dayPicks.filter((o) => o.id !== entry.id && Math.abs(o.mins - entry.mins) < SET_MINUTES);
  }

  let backups = (() => {
    try { return JSON.parse(localStorage.getItem('lotd2026_backups') || '{}') || {}; } catch (e) { return {}; }
  })();
  function isBackup(entry) { return !!backups[entry.id]; }
  function saveBackups() {
    try { localStorage.setItem(BACKUP_KEY, JSON.stringify(backups)); } catch (e) { /* not persisted */ }
  }

  function mergeIntervals(intervals) {
    intervals.sort((a, b) => a[0] - b[0]);
    const merged = [];
    intervals.forEach((iv) => {
      const last = merged[merged.length - 1];
      if (last && iv[0] <= last[1]) {
        last[1] = Math.max(last[1], iv[1]);
      } else {
        merged.push(iv.slice());
      }
    });
    return merged;
  }

  // Collision-avoidance layout for the venue map: project real lat/lon to
  // canvas coordinates, then iteratively push overlapping circles apart
  // while easing them back toward their true position, so nearby venues
  // never render on top of each other but the map still reads correctly.
  function computeVenueLayout(width, height) {
    const keys = Object.keys(VENUE_INFO).sort((a, b) => VENUE_INFO[a].order - VENUE_INFO[b].order);
    const lats = keys.map((k) => VENUE_INFO[k].lat).concat([TICKET_DESK.lat]);
    const lons = keys.map((k) => VENUE_INFO[k].lon).concat([TICKET_DESK.lon]);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const pad = 34;
    const midLatRad = (minLat + maxLat) / 2 * Math.PI / 180;
    const lonScale = Math.cos(midLatRad);
    const latSpan = (maxLat - minLat) || 0.001;
    const lonSpanEff = (maxLon - minLon) * lonScale || 0.001;
    const scale = Math.min((width - 2 * pad) / lonSpanEff, (height - 2 * pad) / latSpan);
    const drawW = lonSpanEff * scale, drawH = latSpan * scale;
    const offX = pad + ((width - 2 * pad) - drawW) / 2;
    const offY = pad + ((height - 2 * pad) - drawH) / 2;
    const proj = (lat, lon) => [offX + (lon - minLon) * lonScale * scale, offY + (maxLat - lat) * scale];

    const GAP = 3.5;
    const nodes = keys.map((k) => {
      const info = VENUE_INFO[k];
      const [x, y] = proj(info.lat, info.lon);
      const r = 8 + info.cap * 2.6;
      return { key: k, order: info.order, name: info.name, r, x, y, origX: x, origY: y };
    });
    const [tdX, tdY] = proj(TICKET_DESK.lat, TICKET_DESK.lon);
    const td = { r: 5, x: tdX, y: tdY, origX: tdX, origY: tdY };
    const all = nodes.concat([td]);

    for (let iter = 0; iter < 400; iter++) {
      for (let i = 0; i < all.length; i++) {
        for (let j = i + 1; j < all.length; j++) {
          const a = all[i], b = all[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const minDist = a.r + b.r + GAP;
          if (dist < minDist) {
            const move = (minDist - dist) / 2;
            const ux = dx / dist, uy = dy / dist;
            a.x -= ux * move; a.y -= uy * move;
            b.x += ux * move; b.y += uy * move;
          }
        }
      }
      all.forEach((n) => {
        n.x += (n.origX - n.x) * 0.015;
        n.y += (n.origY - n.y) * 0.015;
        n.x = Math.max(n.r + 4, Math.min(width - n.r - 4, n.x));
        n.y = Math.max(n.r + 4, Math.min(height - n.r - 4, n.y));
      });
    }

    return { nodes, td };
  }

  /* ============================================================
     3. STORAGE & URL MANAGEMENT
     ============================================================ */

  function loadPicks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
