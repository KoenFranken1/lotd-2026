  }

  // Older versions stored one flag per showtime, keyed "actIdx-showIdx".
  // Collapse any of those into the current per-artist format (keyed by
  // actIdx, value "want"/"must") so nothing gets lost on upgrade.
  function migratePicks(raw) {
    const out = {};
    let changed = false;
    Object.keys(raw).forEach((key) => {
      if (key.includes('-')) {
        const actIdx = key.split('-')[0];
        if (!out[actIdx]) out[actIdx] = 'want';
        changed = true;
      } else {
        out[key] = raw[key] === 'must' ? 'must' : 'want';
      }
    });
    return { picks: out, changed };
  }

  // A shared link can carry picks in ?picks=actIdx:priority,actIdx:priority
  // — if present, ask before loading them so it never silently overwrites
  // the visitor's own list, then strip the param so a refresh won't re-prompt.
  function loadSharedPicksFromURL() {
    try {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get('picks');
      if (!raw) return null;

      const shared = {};
      let count = 0;
      raw.split(',').forEach((pair) => {
        const [actIdx, priRaw] = pair.split(':');
        const pri = priRaw === 'must' ? 'must' : 'want';
        if (RAW[actIdx]) { shared[actIdx] = pri; count++; }
      });

      window.history.replaceState({}, '', window.location.origin + window.location.pathname);

      if (!count) return null;
      const ok = confirm(
        `This link includes a shared list of ${count} picks. Load them into your planner? (Replaces your current picks, if any.)`
      );
      return ok ? shared : null;
    } catch (e) {
      return null;
    }
  }

  /* ============================================================
     4. HTML TEMPLATE GENERATORS
     ============================================================ */

  function capBadgeHTML(info) {
    if (!info) return '';
    return `<span class="cap-badge-text" title="${capLabel(info.cap)}">${capShortLabel(info.cap)}</span>`;
  }

  function venueNumTagHTML(info) {
    if (!info) return '';
    return `<span class="venue-num-tag">(#${info.order})</span>`;
  }

  function buildVenueSVG(width, height, colors) {
    const { nodes, td } = computeVenueLayout(width, height);
    const font = 'Space Grotesk, sans-serif';
    let svg = `<svg viewBox="0 0 ${width} ${height}" class="venue-map" xmlns="http://www.w3.org/2000/svg">`;
    svg += `<rect x="0" y="0" width="${width}" height="${height}" fill="${colors.bg}" rx="4"/>`;
    // Ticket desk marker only — its label lives in a legend below the map
    // instead of floating text, which used to land on top of nearby circles.
    svg += `<circle cx="${td.x.toFixed(1)}" cy="${td.y.toFixed(1)}" r="5" fill="${colors.accent}"><title>Ticket desk</title></circle>`;
    nodes.forEach((n) => {
      const info = VENUE_INFO[n.key];
      svg += `<g class="venue-node" data-key="${escapeHtml(n.key)}" tabindex="0" role="button" aria-label="${escapeHtml(n.name)}, venue number ${n.order}">`;
      svg += `<title>${escapeHtml(n.name)} — ${info.walk} min walk</title>`;
      svg += `<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${n.r.toFixed(1)}" fill="${colors.dotFill}" stroke="${colors.dot}" stroke-width="1.3"/>`;
      svg += `<text x="${n.x.toFixed(1)}" y="${(n.y + 3.5).toFixed(1)}" font-size="10.5" font-weight="700" font-family="${font}" fill="${colors.dot}" text-anchor="middle">${n.order}</text>`;
      svg += '</g>';
    });
    svg += '</svg>';
    return svg;
  }

  function buildVenueTableRows() {
    return Object.keys(VENUE_INFO)
      .sort((a, b) => VENUE_INFO[a].order - VENUE_INFO[b].order)
      .map((k) => ({ key: k, v: VENUE_INFO[k] }));
  }

  function buildVenueTableHTML() {
    const rows = buildVenueTableRows()
      .map(({ key, v }) => `
        <tr class="venue-table-row" data-key="${escapeHtml(key)}">
          <td class="vt-num">${v.order}</td>
          <td class="vt-name">${escapeHtml(v.name)}</td>
          <td>${escapeHtml(v.addr)}</td>
          <td>${capBadgeHTML(v)}</td>
        </tr>`)
      .join('');
    return `
      <div class="venue-table-wrap">
        <table class="venue-table">
          <thead><tr><th>#</th><th>Venue</th><th>Address</th><th>Capacity</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function renderVenuesView(selectedKey) {
    const svg = buildVenueSVG(600, 560, DARK_MAP_COLORS);
    return `
      <div class="venues-view">
        <div class="venue-map-wrap">${svg}</div>
        <div class="venue-legend"><span class="legend-dot ticket-desk-dot"></span> Ticket desk</div>
        <div id="venueDetail">${venueDetailHTML(selectedKey)}</div>
        ${buildVenueTableHTML()}
      </div>`;
  }

  function actsAtVenueKey(key) {
    const info = VENUE_INFO[key];
    if (!info) return [];
    return entries
      .filter((e) => e.venueInfo === info && e.venueKey === key)
      .sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || a.mins - b.mins);
  }

  function venueDetailHTML(key) {
    if (!key || !VENUE_INFO[key]) {
      return `<p class="venue-detail-hint">Tap a venue on the map — or a row in the table below — to see who's playing there and how far it is from the ticket desk.</p>`;
    }
    const info = VENUE_INFO[key];
    const acts = actsAtVenueKey(key);
    const actsHTML = acts.length
      ? acts.map((e) => `
          <div class="vd-act">
            <span class="vd-day">${e.day.slice(0, 3)}</span>
            <span class="vd-time">${e.time}</span>
            <span class="vd-name">${escapeHtml(e.name)}</span>
          </div>`).join('')
      : '<div class="vd-empty">No acts playing here on your ticketed days.</div>';
    return `
      <div class="venue-detail">
        <div class="vd-header">
          <span class="venue-num-tag">#${info.order}</span>
          <span class="vd-name-big">${escapeHtml(info.name)}</span>
          ${capBadgeHTML(info)}
        </div>
        <div class="vd-walk">${info.walk} min walk from the ticket desk · ${escapeHtml(info.addr)}</div>
        <div class="vd-acts">${actsHTML}</div>
      </div>`;
  }

  function rowHTML(entry, clashWith, { picks, state, showCountByAct }) {
    const priority = picks[entry.actIdx] || null;
    const isStarred = !!priority;
    const isOpen = !!state.open[entry.id];
    const classes = [
      'row',
      isStarred && 'starred',
      priority === 'must' && 'must',
      isOpen && 'open',
      isStarred && isBackup(entry) && 'backup',
      clashWith && 'clash'
    ].filter(Boolean).join(' ');

    const showCount = showCountByAct.get(entry.actIdx) || 1;
    const showCountHTML = showCount > 1 ? `<span class="show-count">· ${showCount} shows</span>` : '';
    const starIcon = priority === 'must' ? '★' : '☆';
    const starLabel = priority === 'must'
      ? 'Must-see — tap for want-to-see'
      : priority === 'want'
        ? 'Want to see — tap for must-see'
        : 'Tap to add to want-to-see';

    const displayVenue = venueDisplayName(entry.venue, entry.venueInfo);
    const venueLine = entry.venueInfo
      ? `
        <div class="venue-line">
          <span class="venue-pin">📍</span>
          <span class="venue-name">${escapeHtml(displayVenue)}</span>
          ${venueNumTagHTML(entry.venueInfo)}
          <span class="venue-sep">•</span>
          ${capBadgeHTML(entry.venueInfo)}
        </div>`
      : `<div class="venue-line"><span class="venue-pin">📍</span><span class="venue-name">${escapeHtml(entry.venue)}</span></div>`;

    const genreLine = entry.genre || showCount > 1
      ? `<div class="genre-line">${genrePillsHTML(entry.genre)}${showCountHTML}</div>`
      : '';

    const fansLine = entry.fansOf
      ? `<b>For fans of:</b> ${escapeHtml(entry.fansOf)}`
      : 'No "for fans of" listed.';

    const clashLine = clashWith
      ? `<div class="clash-note">Clashes with ${escapeHtml(clashWith.name)} at ${clashWith.venue} (${clashWith.time})</div>`
      : '';

    const removeLine = isStarred
      ? `<button class="remove-pick-btn" data-actidx="${entry.actIdx}">Remove from picks</button>`
      : '';

    return `
      <div class="${classes}" data-id="${entry.id}" data-actidx="${entry.actIdx}">
        <div class="time">${entry.time}</div>
        <div class="info">
          <div class="name-line"><span class="name">${escapeHtml(entry.name)}</span>${isStarred && isBackup(entry) ? '<span class="plan-b-tag">Plan B</span>' : ''}</div>
          ${venueLine}
          ${genreLine}
          <div class="fans">${fansLine}</div>
          ${clashLine}
          ${resolveHTML(entry)}
          ${removeLine}
        </div>
        <button class="star-btn" aria-label="${starLabel}" title="${starLabel}">${starIcon}</button>
      </div>`;
  }

  function buildClashDay(day, dayPicks, picks) {
    const venues = {};
    dayPicks.forEach((e) => {
      (venues[e.venue] = venues[e.venue] || []).push(e);
    });
    const venueNames = Object.keys(venues).sort((a, b) => {
      const minA = Math.min(...venues[a].map((x) => x.mins));
      const minB = Math.min(...venues[b].map((x) => x.mins));
      return minA - minB;
    });

    const allMins = dayPicks.map((e) => e.mins);
    const minStart = Math.min(...allMins) - 25;
    const maxEnd = Math.max(...allMins.map((m) => m + SET_MINUTES)) + 15;
    const totalSpan = maxEnd - minStart;

    // Every 40-minute block gets a guaranteed minimum pixel width,
    // regardless of how many hours the day spans — names stay readable
    // and a wide day just scrolls further instead of squeezing blocks.
    const MIN_BLOCK_PX = 76;
    const pxPerMinute = MIN_BLOCK_PX / SET_MINUTES;
    const timelineWidth = Math.max(360, Math.round(totalSpan * pxPerMinute));

    const rowH = 44, headerH = 20;
    const gridHeight = headerH + venueNames.length * rowH;

    const firstHour = Math.ceil(minStart / 60);
    const lastHour = Math.floor(maxEnd / 60);
    const hourMarks = [];
    for (let h = firstHour; h <= lastHour; h++) hourMarks.push(h);

    let labelsHTML = `<div style="height:${headerH}px;"></div>`;
    venueNames.forEach((vn, vi) => {
      labelsHTML += `<div class="clash-venue-label" style="top:${headerH + vi * rowH}px; height:${rowH}px;">${escapeHtml(vn)}</div>`;
    });

    let linesHTML = '';
    hourMarks.forEach((h) => {
      const pct = ((h * 60 - minStart) / totalSpan * 100).toFixed(2);
      const label = `${String(h % 24).padStart(2, '0')}:00`;
      linesHTML += `<div class="clash-hourline" style="left:${pct}%; top:${headerH}px; height:${gridHeight - headerH}px;"></div>`;
      linesHTML += `<div class="clash-hourlabel" style="left:${pct}%;">${label}</div>`;
    });

    let rowsHTML = '';
    venueNames.forEach((vn, vi) => {
      const top = headerH + vi * rowH;
      if (vi % 2 === 0) rowsHTML += `<div class="clash-row-bg" style="top:${top}px; height:${rowH}px;"></div>`;
    });

    // Shade the whole time window behind any overlapping picks, spanning
    // every venue row, so a clash is visible at a glance before reading
    // any block.
    const clashingIntervals = dayPicks
      .filter((e) => !!findClash(e, dayPicks))
      .map((e) => [e.mins, e.mins + SET_MINUTES]);
    const bandsHTML = mergeIntervals(clashingIntervals)
      .map((iv) => {
        const left = ((iv[0] - minStart) / totalSpan * 100).toFixed(2);
        const width = ((iv[1] - iv[0]) / totalSpan * 100).toFixed(2);
        return `<div class="clash-band" style="left:${left}%; width:${width}%; top:${headerH}px; height:${gridHeight - headerH}px;"></div>`;
      })
      .join('');

    let blocksHTML = '';
    venueNames.forEach((vn, vi) => {
      const top = headerH + vi * rowH;
      venues[vn].forEach((e) => {
        const left = ((e.mins - minStart) / totalSpan * 100).toFixed(2);
        const width = (SET_MINUTES / totalSpan * 100).toFixed(2);
        const clash = findClash(e, dayPicks);
        const priority = picks[e.actIdx];
        const isMust = priority === 'must';
        blocksHTML += `
          <div class="clash-block${clash ? ' clash' : ''}${isMust ? ' must' : ''}${isBackup(e) ? ' backup' : ''}" data-id="${e.id}" data-actidx="${e.actIdx}"
               style="left:${left}%; width:${width}%; top:${top + 3}px; height:${rowH - 6}px;"
               title="${escapeHtml(e.name)} — ${e.time} at ${escapeHtml(vn)}${clash ? ` (clashes with ${escapeHtml(clash.name)})` : ''}">
            <span class="cb-time">${e.time}</span><span class="cb-name">${isBackup(e) ? 'B · ' : isMust ? '★ ' : ''}${escapeHtml(e.name)}</span>
          </div>`;
      });
    });

    return `
      <div class="clash-day">
        <div class="clash-day-title">${day}</div>
        <div class="clash-day-body">
          <div class="clash-venue-col" style="height:${gridHeight}px;">${labelsHTML}</div>
          <div class="clash-timeline-wrap">
            <div class="clash-timeline" style="height:${gridHeight}px; width:${timelineWidth}px;">${rowsHTML}${bandsHTML}${linesHTML}${blocksHTML}</div>
          </div>
        </div>
      </div>`;
  }

  function renderShareView(picks) {
    const pickIds = Object.keys(picks);
    const base = window.location.origin + window.location.pathname;
    const pairs = pickIds.map((actIdx) => `${actIdx}:${picks[actIdx]}`);
    const pickUrl = `${base}?picks=${encodeURIComponent(pairs.join(','))}`;

    const withPicksBlock = pickIds.length
      ? `
        <p class="share-note">Whoever opens this link gets asked before it loads your ${pickIds.length} picks — it won't overwrite anything they've already starred without asking.</p>
        <div class="share-url-row">
          <input type="text" readonly value="${escapeHtml(pickUrl)}" id="pickUrlInput">
          <button class="share-copy-btn" data-target="pickUrlInput">Copy</button>
        </div>`
      : `<p class="share-note">Star some acts first — this link will carry your exact picks so whoever opens it can load the same list.</p>`;

    return `
      <div class="share-view">
        <div class="share-block">
          <h3>Share with your picks${pickIds.length ? ` (${pickIds.length})` : ''}</h3>
          ${withPicksBlock}
        </div>
        <div class="share-block">
          <h3>Share blank</h3>
          <p class="share-note">Same planner, nothing pre-loaded — good for sending to someone building their own list from scratch.</p>
          <div class="share-url-row">
            <input type="text" readonly value="${escapeHtml(base)}" id="blankUrlInput">
            <button class="share-copy-btn" data-target="blankUrlInput">Copy</button>
          </div>
        </div>
      </div>`;
  }

  function buildPrintVenueTableHTML() {
    const rows = buildVenueTableRows()
      .map(({ v }) => `
        <tr>
          <td>${v.order}</td>
          <td><b>${escapeHtml(v.name)}</b><br><span style="color:#777">${escapeHtml(v.addr)}</span></td>
          <td>${v.cap}/3</td>
        </tr>`)
      .join('');
    return `<table class="p-venue-table"><thead><tr><th>#</th><th>Venue</th><th>Cap</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function buildPrintDoc({ picks, presentDays, pickedEntriesForDay }) {
    const starredCount = Object.keys(picks).length;
    let schedule = '';

    if (starredCount === 0) {
      schedule = '<p class="p-empty">No picks starred yet — star some acts first, then come back to print.</p>';
    } else {
      presentDays.forEach((d) => {
        const dayPicks = pickedEntriesForDay(d);
        if (!dayPicks.length) return;
        dayPicks.sort((a, b) => a.mins - b.mins);
        schedule += `<div class="p-day">${d}</div>`;
        dayPicks.forEach((e) => {
          const clash = findClash(e, dayPicks);
          const isMust = picks[e.actIdx] === 'must';
          schedule += `
            <div class="p-row">
              <div class="p-time">${e.time}</div>
              <div>
                <div>${isMust ? '<span class="p-must">★</span> ' : ''}<span class="p-name">${escapeHtml(e.name)}</span>${isBackup(e) ? ' <span class="p-venue">(plan B)</span>' : ''} — <span class="p-venue">${escapeHtml(venueDisplayName(e.venue, e.venueInfo))}</span>${e.venueInfo ? ` <span class="p-num">#${e.venueInfo.order}</span>` : ''}</div>
                ${clash ? `<div class="p-clash">Clashes with ${escapeHtml(clash.name)} (${clash.time}, ${clash.venue})</div>` : ''}
              </div>
            </div>`;
        });
      });
    }

    const venueGuide = `
      <h2>Venue guide</h2>
      <div class="p-map-wrap">${buildVenueSVG(400, 400, LIGHT_MAP_COLORS)}</div>
      ${buildPrintVenueTableHTML()}`;

    return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
      <title>Left of the Dial 2026 — My picks</title><style>
      @page{size:landscape;margin:12mm;}
      *{box-sizing:border-box;}
      body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;color:#111;background:#fff;margin:0;padding:20px 24px;}
      h1{font-size:21px;margin:0 0 2px;}
      h2{font-size:15px;margin:0 0 8px;}
      .sub{font-size:11.5px;color:#555;margin:0 0 16px;}
      .print-layout{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start;}
      .col-left, .col-right{min-width:0;}
      .p-day{font-size:14px;font-weight:700;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid #999;break-after:avoid;}
      .p-day:first-child{margin-top:0;}
      .p-row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #ddd;font-size:12.5px;break-inside:avoid;}
      .p-time{width:44px;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums;}
      .p-name{font-weight:600;}
      .p-must{color:#B0301A;font-weight:700;}
      .p-venue{color:#555;}
      .p-num{color:#999;font-weight:600;}
      .p-clash{color:#B0301A;font-size:11px;margin-top:2px;}
      .p-empty{font-size:13px;color:#555;}
      .p-map-wrap{max-width:100%;margin-bottom:10px;}
      .p-map-wrap svg{width:100%;height:auto;max-width:340px;display:block;}
      .p-venue-note{font-size:10px;color:#666;line-height:1.45;margin:0 0 10px;}
      table.p-venue-table{border-collapse:collapse;width:100%;font-size:9.5px;}
      table.p-venue-table th,table.p-venue-table td{text-align:left;padding:3px 4px;border-bottom:1px solid #ddd;vertical-align:top;}
      table.p-venue-table th{color:#555;font-weight:600;font-size:9px;}
      .hint{margin-top:18px;font-size:11px;color:#888;}
      @media print{.hint{display:none;}}
      </style></head><body>
      <h1>Left of the Dial 2026 — My picks</h1>
      <p class="sub">21–24 October 2026 · Rotterdam</p>
      <div class="print-layout">
        <div class="col-left">${schedule}</div>
        <div class="col-right">${venueGuide}</div>
      </div>
      <p class="hint">Press Cmd/Ctrl+P to print — choose Landscape orientation for the best fit.</p>
      </body></html>`;
  }

  /* ============================================================
     5. STATE MANAGEMENT & CORE RENDER LOOP
     ============================================================ */

  // Flatten into per-show entries, one row per (act, show).
  // No tickets for Wednesday, so those sets are dropped entirely — any
  // act that only played Wednesday simply won't appear anywhere.
  const entries = [];
  RAW.forEach((act, idx) => {
    act.s.forEach((show, si) => {
      if (show.d === 'Wednesday') return;
      entries.push({
        id: `${idx}-${si}`,
        actIdx: idx,
        name: act.n,
        fansOf: act.f,
        genre: act.g,
        day: show.d,
        venue: show.v,
        venueInfo: venueInfoFor(show.v),
        venueKey: venueKeyFor(show.v),
        time: show.t,
        mins: toMinutes(show.t)
      });
    });
  });

  // Precomputed once instead of re-scanning `entries` for every row on
  // every render — O(1) lookups instead of an O(n) reduce per row.
  const showCountByAct = new Map();
  entries.forEach((e) => showCountByAct.set(e.actIdx, (showCountByAct.get(e.actIdx) || 0) + 1));

  const presentDays = DAYS.filter((d) => entries.some((e) => e.day === d));

  const genreSet = new Set();
  RAW.forEach((act) => {
    if (!act.g) return;
    act.g.split('/').forEach((g) => genreSet.add(g.trim()));
  });
  const genres = [...genreSet].sort();

  const state = {
    day: presentDays[0],
    query: '',
    genre: '',
    view: 'day', // 'day' | 'picks' | 'venues' | 'clash' | 'share'
    open: {},
    selectedVenue: null,
    layout: (() => {
      try { return localStorage.getItem(LAYOUT_KEY) === 'grid' ? 'grid' : 'list'; } catch (e) { return 'list'; }
    })(),
    ttSelected: null // entry id of the timetable block whose popover is open
  };

  let picks = loadPicks();
  const migrated = migratePicks(picks);
  if (migrated.changed) {
    picks = migrated.picks;
    savePicks(picks);
  }
  const sharedPicks = loadSharedPicksFromURL();
  if (sharedPicks) {
    picks = sharedPicks;
    savePicks(picks);
  }

  const isEntryPicked = (e) => !!picks[e.actIdx];

  function removePick(actIdx) {
    delete picks[actIdx];
    Object.keys(backups).forEach((id) => { if (id.split('-')[0] === String(actIdx)) delete backups[id]; });
    savePicks(picks);
    saveBackups();
  }

  function setBackup(entryId) {
    backups[entryId] = true;
    saveBackups();
  }

  // "This one is plan A": un-backup it and push every overlapping pick to plan B.
  function setPrimary(entryId) {
    const entry = entries.find((e) => e.id === entryId);
    if (!entry) return;
    delete backups[entryId];
    overlappingPicks(entry, pickedEntriesForDay(entry.day)).forEach((o) => { backups[o.id] = true; });
    saveBackups();
  }

  // Other shows by the same act, flagged when they'd fit without a clash —
  // with 2–3 shows per act, often the real fix is just catching another one.
  function otherShowsHTML(entry) {
    const others = entries.filter((o) => o.actIdx === entry.actIdx && o.id !== entry.id);
    if (!others.length) return '';
    const parts = others.map((o) => {
      const free = !overlappingPicks(o, pickedEntriesForDay(o.day)).some((x) => x.actIdx !== o.actIdx && !isBackup(x));
      return `${o.day.slice(0, 3)} ${o.time} at ${escapeHtml(venueDisplayName(o.venue, o.venueInfo))}${free ? ' <span class="ok">· no clash</span>' : ''}`;
    });
    return `<div class="other-shows">Also plays: ${parts.join('; ')}</div>`;
  }

  // Shared plan-A/plan-B block for list rows and both popovers.
  function resolveHTML(entry) {
    if (!picks[entry.actIdx]) return '';
    const dayPicks = pickedEntriesForDay(entry.day);
    const overlaps = overlappingPicks(entry, dayPicks);
    if (!overlaps.length && !isBackup(entry)) return '';
    const names = overlaps.map((o) => `<b>${escapeHtml(o.name)}</b>`).join(', ');
    let note, actions;
    if (isBackup(entry)) {
      note = `<div class="resolve-note">Plan B${overlaps.length ? ` — backup for ${names}` : ''}.</div>`;
      actions = `<button class="resolve-btn" data-resolve="primary" data-id="${entry.id}">Make this plan A</button>`;
    } else {
      const unresolved = overlaps.filter((o) => !isBackup(o));
      if (!unresolved.length) {
        note = `<div class="resolve-note">Plan A. ${names} ${overlaps.length > 1 ? 'are your backups' : 'is your plan B'}.</div>`;
        actions = `<button class="resolve-btn" data-resolve="backup" data-id="${entry.id}">Make this plan B instead</button>`;
      } else {
        note = `<div class="resolve-note warn">Overlaps with ${unresolved.map((o) => `<b>${escapeHtml(o.name)}</b> (${o.time})`).join(', ')}.</div>`;
        actions = `<button class="resolve-btn" data-resolve="primary" data-id="${entry.id}">This is plan A</button>
          <button class="resolve-btn" data-resolve="backup" data-id="${entry.id}">This is plan B</button>`;
      }
    }
    return `<div class="resolve-box">${note}${otherShowsHTML(entry)}<div class="resolve-actions">${actions}</div></div>`;
  }
  // Once an act is starred, tapping the star only toggles between the two
  // priority levels — it never silently drops back to unstarred, so you
  // can't lose a pick by cycling past "must". Removing a pick entirely is
  // a separate, explicit action (the "Remove from picks" link once a
  // starred row is expanded, or a Clash finder block).
  const cyclePriority = (current) => {
    if (!current) return 'want';
    return current === 'want' ? 'must' : 'want';
  };
  const pickedEntriesForDay = (day) => entries.filter((e) => isEntryPicked(e) && e.day === day);
  const matchesFilter = (e) => {
    if (state.genre && !(e.genre || '').includes(state.genre)) return false;
    if (state.query) {
      const haystack = `${e.name} ${e.fansOf} ${e.genre} ${e.venue}`.toLowerCase();
      if (!haystack.includes(state.query)) return false;
    }
    return true;
  };

  function clashPopoverContentHTML(entry) {
    const dayPicks = pickedEntriesForDay(entry.day);
    const clash = findClash(entry, dayPicks);
    const priority = picks[entry.actIdx];
    const displayVenue = venueDisplayName(entry.venue, entry.venueInfo);
    return `
      <button class="clash-popover-close" aria-label="Close">×</button>
      <div class="cd-header">
        <span class="cd-name-big">${priority === 'must' ? '★ ' : ''}${escapeHtml(entry.name)}</span>
      </div>
      <div class="cd-meta">${entry.day} · ${entry.time} · ${escapeHtml(displayVenue)}${entry.venueInfo ? ` (#${entry.venueInfo.order})` : ''}</div>
      ${resolveHTML(entry)}
      <button class="cd-remove-btn" data-actidx="${entry.actIdx}">Remove from picks</button>`;
  }

  function renderClashView() {
    const daysWithPicks = presentDays.filter((d) => pickedEntriesForDay(d).length > 0);
    if (!daysWithPicks.length) {
      return '<div class="empty">No picks yet — star some acts first and they\'ll show up here laid out by venue and time, clash-style.</div>';
    }
    let html = '<div class="clash-view"><p class="clash-note">Gold fill = must-see, green border = clear, red border and shaded column = unresolved clash, dashed = plan B. Tap a block to pick plan A.</p>';
    daysWithPicks.forEach((d) => {
      html += buildClashDay(d, pickedEntriesForDay(d), picks);
    });
    html += '</div>';
    return html;
  }


  /* ---------- Timetable (full-day grid: venues across, time down) ---------- */

  const PX_PER_MIN = 1.7;
  const fmtMins = (m) => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;

  function buildTimetable(day) {
    const dayEntries = entries.filter((e) => e.day === day);
    if (!dayEntries.length) return `<div class="empty">No sets on ${day}.</div>`;

    const narrow = window.innerWidth < 520;
    const COL_W = narrow ? 100 : 118;
    const TIME_W = narrow ? 42 : 50;

    // One column per actual room (TR Up and TR Down stay separate),
    // ordered by the same walking-route numbers used on the map.
    const venueOrder = (v) => (venueInfoFor(v) ? venueInfoFor(v).order : 99);
    const venues = [...new Set(dayEntries.map((e) => e.venue))].sort(
      (a, b) => venueOrder(a) - venueOrder(b) || a.localeCompare(b)
    );
    const colOf = new Map(venues.map((v, i) => [v, i]));

    const start = Math.floor(Math.min(...dayEntries.map((e) => e.mins)) / 60) * 60;
    const end = Math.ceil(Math.max(...dayEntries.map((e) => e.mins + SET_MINUTES)) / 60) * 60;
    const height = Math.round((end - start) * PX_PER_MIN);
    const canvasW = venues.length * COL_W;

    const dayPicks = pickedEntriesForDay(day);
    const filtering = !!(state.query || state.genre);
    let matchCount = 0;

    const headHTML = venues.map((v) => {
      const info = venueInfoFor(v);
      return `<div class="tt-venue" style="width:${COL_W}px">
        <span class="tt-venue-name">${escapeHtml(venueDisplayName(v, info))}</span>
        ${info ? `<span class="tt-venue-num">#${info.order}</span>` : ''}
      </div>`;
    }).join('');

    let hoursHTML = '';
    for (let m = start; m < end; m += 60) {
      hoursHTML += `<div class="tt-hour" style="top:${Math.round((m - start) * PX_PER_MIN)}px">${fmtMins(m)}</div>`;
    }

    const blocksHTML = dayEntries.map((e) => {
      const pri = picks[e.actIdx] || null;
      const clash = pri ? findClash(e, dayPicks) : null;
      const matches = matchesFilter(e);
      if (filtering && matches) matchCount++;
      const cls = [
        'tt-block',
        pri && 'picked',
        pri === 'must' && 'must',
        clash && 'clash',
        pri && isBackup(e) && 'backup',
        filtering && !matches && 'dim',
        state.ttSelected === e.id && 'selected'
      ].filter(Boolean).join(' ');
      const top = Math.round((e.mins - start) * PX_PER_MIN) + 2;
      const h = Math.round(SET_MINUTES * PX_PER_MIN) - 4;
      const left = colOf.get(e.venue) * COL_W + 3;
      const star = pri && isBackup(e) ? 'B · ' : pri === 'must' ? '★ ' : pri ? '☆ ' : '';
      const label = `${e.name}, ${e.time} at ${venueDisplayName(e.venue, e.venueInfo)}${pri ? `, ${pri === 'must' ? 'must-see' : 'want to see'}` : ''}${clash ? `, clashes with ${clash.name}` : ''}`;
      return `<div class="${cls}" role="button" tabindex="0" data-id="${e.id}" data-actidx="${e.actIdx}"
          aria-label="${escapeHtml(label)}"
          style="top:${top}px;left:${left}px;width:${COL_W - 7}px;height:${h}px">
          <span class="tb-time">${e.time}–${fmtMins(e.mins + SET_MINUTES)}</span>
          <span class="tb-name">${star}${escapeHtml(e.name)}</span>
        </div>`;
    }).join('');

    const metaLeft = filtering
      ? (matchCount ? `${matchCount} matching set${matchCount === 1 ? '' : 's'} highlighted` : 'Nothing matches — showing the full day')
      : `${dayEntries.length} sets · ${venues.length} rooms · tap a set to star it`;

    return `
      <div class="tt-meta">
        <span>${metaLeft}</span>
        <span class="tt-legend">
          <span><i class="lg-want"></i>Want</span>
          <span><i class="lg-must"></i>Must-see</span>
          <span><i class="lg-clash"></i>Clash</span>
          <span><i class="lg-backup"></i>Plan B</span>
        </span>
      </div>
      <div class="tt-scroll" data-day="${day}" style="--tt-day:${DAY_COLOR[day]}">
        <div class="tt" style="width:${TIME_W + canvasW}px">
          <div class="tt-head">
            <div class="tt-corner" style="width:${TIME_W}px"></div>
            ${headHTML}
          </div>
          <div class="tt-body">
            <div class="tt-times" style="width:${TIME_W}px;height:${height}px">${hoursHTML}</div>
            <div class="tt-canvas" style="width:${canvasW}px;height:${height}px;--tt-hour:${Math.round(60 * PX_PER_MIN)}px;--tt-col:${COL_W}px">
              ${blocksHTML}
            </div>
          </div>
        </div>
      </div>`;
  }

  function timetablePopoverHTML(entry) {
    const pri = picks[entry.actIdx] || null;
    const clash = pri ? findClash(entry, pickedEntriesForDay(entry.day)) : null;
    const info = entry.venueInfo;
    const showCount = showCountByAct.get(entry.actIdx) || 1;
    return `
      <button class="clash-popover-close" aria-label="Close">×</button>
      <div class="cd-header"><span class="cd-name-big">${escapeHtml(entry.name)}</span></div>
      <div class="cd-meta">${entry.day} · ${entry.time}–${fmtMins(entry.mins + SET_MINUTES)} · ${escapeHtml(venueDisplayName(entry.venue, info))}${info ? ` (#${info.order})` : ''}</div>
      ${entry.genre ? `<div class="tp-pills">${genrePillsHTML(entry.genre)}</div>` : ''}
      ${entry.fansOf ? `<div class="tp-fans"><b>For fans of:</b> ${escapeHtml(entry.fansOf)}</div>` : ''}
      ${showCount > 1 ? `<div class="tp-fans">Plays ${showCount} times this weekend — a star covers every show.</div>` : ''}
      ${resolveHTML(entry)}
      <div class="tp-actions">
        <button class="tp-btn tp-want${pri === 'want' ? ' active' : ''}" data-pri="want" data-actidx="${entry.actIdx}">☆ Want to see</button>
        <button class="tp-btn tp-must${pri === 'must' ? ' active' : ''}" data-pri="must" data-actidx="${entry.actIdx}">★ Must-see</button>
        ${pri ? `<button class="tp-btn tp-remove" data-actidx="${entry.actIdx}">Remove</button>` : ''}
      </div>`;
  }

  /* ---------- Now / Next ---------- */

  // Festival nights: sets after midnight belong to the evening before.
  const FESTIVAL_DATES = { '2026-10-22': 'Thursday', '2026-10-23': 'Friday', '2026-10-24': 'Saturday' };

  function amsterdamNow() {
    try {
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Amsterdam', year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
      }).formatToParts(new Date()).map((p) => [p.type, p.value]));
      let h = parseInt(parts.hour, 10);
      const m = parseInt(parts.minute, 10);
      let d = new Date(Date.UTC(+parts.year, +parts.month - 1, +parts.day));
      if (h < 4) { d = new Date(d.getTime() - 86400000); h += 24; }
      return { date: d.toISOString().slice(0, 10), mins: h * 60 + m, clock: `${parts.hour}:${parts.minute}`, today: `${parts.year}-${parts.month}-${parts.day}` };
    } catch (e) {
      return { date: '', mins: 0, clock: '', today: '' };
    }
  }

  function liveMoment() {
    const n = amsterdamNow();
    const day = FESTIVAL_DATES[n.date];
    return day && presentDays.includes(day) ? { day, mins: n.mins } : null;
  }

  const inMins = (d) => (d <= 0 ? 'now' : d < 60 ? `in ${d} min` : `in ${Math.floor(d / 60)}h ${String(d % 60).padStart(2, '0')}`);

  function renderNowView() {
    const now = amsterdamNow();
    const live = liveMoment();

    if (!live) {
      // Not a festival night: real clock, countdown or wrap-up, plus a peek at the first pick.
      const start = Date.UTC(2026, 9, 22), today = now.today ? Date.parse(now.today + 'T00:00:00Z') : NaN;
      const daysTo = Math.round((start - today) / 86400000);
      const firstPick = presentDays.map((d) => pickedEntriesForDay(d).filter((e) => !isBackup(e)).sort((a, b) => a.mins - b.mins)[0]).find(Boolean);
      const msg = isNaN(daysTo) ? 'Couldn\u2019t read the current time.'
        : daysTo > 1 ? `Left of the Dial starts Thursday 22 October \u2014 ${daysTo} days to go.`
        : daysTo === 1 ? 'Left of the Dial starts tomorrow.'
        : daysTo === 0 ? 'Left of the Dial starts today \u2014 your running order appears here once the first night begins.'
        : 'That\u2019s a wrap for Left of the Dial 2026.';
      return `<div class="now-view">
        <div class="now-clock">
          <div><div class="now-time">${now.clock || '--:--'}</div><div class="now-day">Rotterdam time</div></div>
          <span class="now-badge preview">${daysTo < 0 ? 'Finished' : 'Not started'}</span>
        </div>
        <div class="now-section"><p class="now-empty">${msg}${daysTo >= 0 ? ' On festival nights this tab shows what\u2019s on now, what\u2019s next for you, and what\u2019s starting soon.' : ''}</p></div>
        ${daysTo >= 0 && firstPick ? `<div class="now-section"><h3>Your first pick</h3>
          <div class="now-mini"><span class="t">${firstPick.time}</span>
            <div><div class="n">${picks[firstPick.actIdx] === 'must' ? '\u2605 ' : ''}${escapeHtml(firstPick.name)}</div>
            <div class="m">${firstPick.day} \u00b7 ${escapeHtml(venueDisplayName(firstPick.venue, firstPick.venueInfo))}</div></div><span></span></div></div>` : ''}
      </div>`;
    }

    const { day, mins } = live;
    const dayPicks = pickedEntriesForDay(day).sort((a, b) => a.mins - b.mins);
    const planA = dayPicks.filter((e) => !isBackup(e));
    const playing = dayPicks.filter((e) => e.mins <= mins && mins < e.mins + SET_MINUTES);
    const upcoming = planA.filter((e) => e.mins > mins && !playing.includes(e));

    const clock = `
      <div class="now-clock">
        <div><div class="now-time">${now.clock}</div><div class="now-day">${day}</div></div>
        <span class="now-badge live"><span class="live-dot"></span>Live</span>
      </div>`;

    if (!dayPicks.length) {
      return `<div class="now-view">${clock}
        <div class="now-section"><p class="now-empty">No picks on ${day}. Star a few acts and this turns into your running order \u2014 what\u2019s on and what\u2019s next.</p></div>
        ${soonHTML(day, mins)}</div>`;
    }

    const playingHTML = playing.length
      ? playing.map((e) => {
          const pct = Math.min(100, Math.round((mins - e.mins) / SET_MINUTES * 100));
          const left = e.mins + SET_MINUTES - mins;
          return `<div class="now-card${picks[e.actIdx] === 'must' ? ' must' : ''}">
            <div class="nc-top"><span class="nc-name">${escapeHtml(e.name)}${isBackup(e) ? ' <span class="plan-b-tag">Plan B</span>' : ''}</span><span class="nc-when">${left} min left</span></div>
            <div class="nc-meta">${escapeHtml(venueDisplayName(e.venue, e.venueInfo))} \u00b7 ends ${fmtMins(e.mins + SET_MINUTES)}</div>
            <div class="nc-progress"><span style="width:${pct}%"></span></div>
          </div>`;
        }).join('')
      : '<p class="now-empty">None of your picks are on right now.</p>';

    let nextHTML;
    if (!upcoming.length) {
      nextHTML = `<p class="now-empty">${playing.length ? 'This is your last pick of the night.' : `That\u2019s all your picks for ${day}.`}</p>`;
    } else {
      const [first, ...rest] = upcoming;
      const planB = dayPicks.filter((b) => isBackup(b) && Math.abs(b.mins - first.mins) < SET_MINUTES);
      const clash = findClash(first, dayPicks);
      nextHTML = `
        <div class="now-card big">
          <div class="nc-top"><span class="nc-name">${picks[first.actIdx] === 'must' ? '\u2605 ' : ''}${escapeHtml(first.name)}</span><span class="nc-when">${inMins(first.mins - mins)}</span></div>
          <div class="nc-meta">${first.time} \u00b7 ${escapeHtml(venueDisplayName(first.venue, first.venueInfo))}${first.venueInfo ? ` (#${first.venueInfo.order})` : ''}${first.fansOf ? `<br>For fans of ${escapeHtml(first.fansOf)}` : ''}</div>
          ${planB.length ? `<div class="nc-planb">Plan B: ${planB.map((b) => `${escapeHtml(b.name)} at ${escapeHtml(venueDisplayName(b.venue, b.venueInfo))} (${b.time})`).join(', ')}</div>` : ''}
          ${clash ? `<div class="nc-planb" style="color:var(--danger)">Clashes with ${escapeHtml(clash.name)} \u2014 pick plan A in the Clash Finder.</div>` : ''}
        </div>
        ${rest.slice(0, 5).map((e) => `
          <div class="now-mini">
            <span class="t">${e.time}</span>
            <div><div class="n">${picks[e.actIdx] === 'must' ? '\u2605 ' : ''}${escapeHtml(e.name)}</div>
            <div class="m">${escapeHtml(venueDisplayName(e.venue, e.venueInfo))} \u00b7 ${inMins(e.mins - mins)}</div></div>
            <span></span>
          </div>`).join('')}`;
    }

    return `<div class="now-view">${clock}
      <div class="now-section"><h3>On now</h3>${playingHTML}</div>
      <div class="now-section"><h3>Up next for you</h3>${nextHTML}</div>
      ${soonHTML(day, mins)}
    </div>`;
  }

  // Unpicked sets starting in the next 45 minutes \u2014 for filling a gap
  // without opening the full schedule.
  function soonHTML(day, mins) {
    const soon = entries
      .filter((e) => e.day === day && !picks[e.actIdx] && e.mins >= mins - 5 && e.mins <= mins + 45)
      .sort((a, b) => a.mins - b.mins)
      .slice(0, 8);
    if (!soon.length) return '';
    return `<div class="now-section"><h3>Starting soon, not in your picks</h3>
      ${soon.map((e) => `
        <div class="now-mini">
          <span class="t">${e.time}</span>
          <div><div class="n">${escapeHtml(e.name)}</div>
          <div class="m">${escapeHtml(venueDisplayName(e.venue, e.venueInfo))}${e.genre ? ` \u00b7 ${escapeHtml(e.genre)}` : ''}</div></div>
          <button class="now-star" data-actidx="${e.actIdx}" aria-label="Add ${escapeHtml(e.name)} to picks">\u2606</button>
        </div>`).join('')}
    </div>`;
  }

  const MAIN_TABS = [
    { view: 'now', label: 'Now', short: 'Now' },
    { view: 'day', label: 'Schedule', short: 'Schedule' },
    { view: 'picks', label: 'My Picks', short: 'Picks' },
    { view: 'clash', label: 'Clash Finder', short: 'Clashes' },
    { view: 'venues', label: 'Map & Venues', short: 'Map' }
  ];

  function renderMainTabs() {
    const starredCount = Object.keys(picks).length;
    const isLive = !!liveMoment();
    mainTabs.innerHTML = MAIN_TABS.map(({ view, label, short }) => {
      const isActive = state.view === view;
      const countBadge = view === 'picks' ? ` <span class="n">${starredCount}</span>` : '';
      const dot = view === 'now' && isLive ? '<span class="live-dot"></span>' : '';
      return `<button class="main-tab${isActive ? ' active' : ''}" data-view="${view}">${dot}<span class="lbl-long">${label}</span><span class="lbl-short">${short}</span>${countBadge}</button>`;
    }).join('');
  }

  function renderDayNav() {
    dayNav.innerHTML = presentDays.map((d) => {
      const isActive = state.view === 'day' && state.day === d;
      const count = entries.filter((e) => e.day === d).length;
      return `
        <button class="day-btn${isActive ? ' active' : ''}" data-day="${d}">
          <span class="day-dot" style="background:${DAY_COLOR[d]}"></span>${d} <span class="count">${count}</span>
        </button>`;
    }).join('');
  }

  function render() {
    renderMainTabs();
    renderDayNav();

    const showDayChrome = state.view === 'day';
    dayNav.style.display = showDayChrome ? '' : 'none';
    filterBar.style.display = showDayChrome ? '' : 'none';

    const starredCount = Object.keys(picks).length;
    const isTimetable = state.view === 'day' && state.layout === 'grid';
    document.querySelector('.wrap').classList.toggle('wide', isTimetable);
    layoutToggle.querySelectorAll('button').forEach((b) => {
      const on = b.dataset.layout === state.layout;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });

    // Keep the timetable's scroll position when re-rendering the same day
    // (starring, typing in search), so the grid never jumps back to the top.
    const prevClashScroll = state.view === 'clash'
      ? [...list.querySelectorAll('.clash-timeline-wrap')].map((w) => w.scrollLeft)
      : null;
    const prevScroll = list.querySelector('.tt-scroll');
    const keepScroll = prevScroll && prevScroll.dataset.day === state.day
      ? { left: prevScroll.scrollLeft, top: prevScroll.scrollTop }
      : null;

    let html = '';

    if (state.view === 'now') {
      html = renderNowView();
    } else if (state.view === 'venues') {
      html = renderVenuesView(state.selectedVenue);
    } else if (state.view === 'clash') {
      html = renderClashView();
    } else if (state.view === 'share') {
      html = renderShareView(picks);
    } else if (state.view === 'picks') {
      if (starredCount === 0) {
        html = '<div class="empty">No picks yet.<br>Browse a day and tap the star on anything you don\'t want to miss.</div>';
      } else {
        presentDays.forEach((d) => {
          const dayPicks = pickedEntriesForDay(d);
          if (!dayPicks.length) return;
          dayPicks.sort((a, b) => a.mins - b.mins);
          html += `<div class="day-heading">${d}</div>`;
          dayPicks.forEach((e) => {
            const clash = findClash(e, dayPicks);
            html += rowHTML(e, clash, { picks, state, showCountByAct });
          });
        });
      }
    } else if (isTimetable) {
      html = buildTimetable(state.day);
    } else {
      const dayEntries = entries.filter((e) => e.day === state.day).filter(matchesFilter);
      dayEntries.sort((a, b) => a.mins - b.mins);
      const dayPicksForClash = pickedEntriesForDay(state.day);
      if (!dayEntries.length) {
        html = `<div class="empty">Nothing matches that search on ${state.day}.</div>`;
      } else {
        dayEntries.forEach((e) => {
          const clash = isEntryPicked(e) ? findClash(e, dayPicksForClash) : null;
          html += rowHTML(e, clash, { picks, state, showCountByAct });
        });
      }
    }

    list.innerHTML = html;

    if (prevClashScroll) {
      list.querySelectorAll('.clash-timeline-wrap').forEach((w, i) => { if (prevClashScroll[i]) w.scrollLeft = prevClashScroll[i]; });
    }
    if (isTimetable && keepScroll) {
      const sc = list.querySelector('.tt-scroll');
      if (sc) { sc.scrollLeft = keepScroll.left; sc.scrollTop = keepScroll.top; }
    }
    if (isTimetable && state.ttSelected && !clashPopover.hidden) {
      const entry = entries.find((e) => e.id === state.ttSelected);
      if (entry) clashPopover.innerHTML = timetablePopoverHTML(entry);
    }
  }

  /* ============================================================
     6. EVENT HANDLERS
     ============================================================ */

  // --- DOM refs (queried once, not on every render) ---
  const mainTabs = document.getElementById('mainTabs');
  const dayNav = document.getElementById('dayNav');
  const filterBar = document.getElementById('filterBar');
  const list = document.getElementById('list');
  const genreSel = document.getElementById('genreFilter');
  const layoutToggle = document.getElementById('layoutToggle');
  const shareBtn = document.getElementById('shareBtn');
  const printBtn = document.getElementById('printBtn');
  const searchInput = document.getElementById('search');
  const resetBtn = document.getElementById('resetBtn');

  genres.forEach((g) => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    genreSel.appendChild(opt);
  });

  function scrollVenueDetailIntoView() {
    const el = document.getElementById('venueDetail');
    if (el && typeof el.scrollIntoView === 'function') {
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  // Clash finder popover: floats right next to the tapped block instead of
  // a panel pinned to the top of the view, so checking several blocks on
  // the same day never requires scrolling back and forth.
  const clashPopover = document.getElementById('clashPopover');

  function hideClashPopover() {
    clashPopover.hidden = true;
    clashPopover.innerHTML = '';
    document.querySelectorAll('.clash-block.selected, .tt-block.selected').forEach((b) => b.classList.remove('selected'));
    state.ttSelected = null;
  }

  function showTimetablePopover(blockEl) {
    const entry = entries.find((e) => e.id === blockEl.dataset.id);
    if (!entry) return;
    document.querySelectorAll('.tt-block.selected').forEach((b) => b.classList.remove('selected'));
    blockEl.classList.add('selected');
    state.ttSelected = entry.id;
    clashPopover.innerHTML = timetablePopoverHTML(entry);
    clashPopover.hidden = false;
  }

  function showClashPopover(blockEl) {
    const entry = entries.find((e) => e.id === blockEl.dataset.id);
    if (!entry) return;

    document.querySelectorAll('.clash-block.selected').forEach((b) => b.classList.remove('selected'));
    blockEl.classList.add('selected');

    clashPopover.innerHTML = clashPopoverContentHTML(entry);
    clashPopover.hidden = false;
  }

  clashPopover.addEventListener('click', (e) => {
    if (e.target.closest('.clash-popover-close')) {
      hideClashPopover();
      return;
    }
    const resolveBtn = e.target.closest('.resolve-btn[data-resolve]');
    if (resolveBtn) {
      if (resolveBtn.dataset.resolve === 'backup') setBackup(resolveBtn.dataset.id);
      else setPrimary(resolveBtn.dataset.id);
      const openId = state.ttSelected || (document.querySelector('.clash-block.selected') || {}).dataset?.id;
      render();
      const entry = entries.find((x) => x.id === openId);
      if (entry) {
        clashPopover.innerHTML = state.ttSelected ? timetablePopoverHTML(entry) : clashPopoverContentHTML(entry);
        const blk = document.querySelector(`.clash-block[data-id="${openId}"]`);
        if (blk) blk.classList.add('selected');
      }
      return;
    }
    const priBtn = e.target.closest('.tp-btn[data-pri]');
    if (priBtn) {
      picks[priBtn.dataset.actidx] = priBtn.dataset.pri;
      savePicks(picks);
      render();
      return;
    }
    const ttRemove = e.target.closest('.tp-remove');
    if (ttRemove) {
      removePick(ttRemove.dataset.actidx);
      render();
      return;
    }
    const removeBtn = e.target.closest('.cd-remove-btn');
    if (removeBtn) {
      if (confirm('Remove this artist from your picks (all their shows)?')) {
        removePick(removeBtn.dataset.actidx);
        hideClashPopover();
        render();
      }
    }
  });

  // Close on any click outside the popover and its trigger blocks. It's
  // anchored to a fixed spot on screen (not positioned relative to the
  // clicked block), so it stays visible and correctly placed even while
  // scrolling — no drift, no repositioning math to get wrong.
  document.addEventListener('click', (e) => {
    if (clashPopover.hidden) return;
    // A button that re-rendered the popover is no longer in the document by
    // the time this runs — that click came from inside, so keep it open.
    if (!document.contains(e.target)) return;
    if (e.target.closest('.clash-popover') || e.target.closest('.clash-block') || e.target.closest('.tt-block')) return;
    hideClashPopover();
  });

  function attemptCopy(text, btn) {
    const done = (ok) => {
      btn.textContent = ok ? 'Copied!' : 'Select & copy';
      setTimeout(() => { btn.textContent = 'Copy'; }, 1600);
    };
    const fallback = () => {
      try { done(document.execCommand('copy')); } catch (e) { done(false); }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => done(true)).catch(fallback);
    } else {
      fallback();
    }
  }

  async function handlePrintClick() {
    const doc = buildPrintDoc({ picks, presentDays, pickedEntriesForDay });
    let downloads = null;
    try { downloads = await window.claude.use('downloads'); } catch (e) { downloads = null; }

    if (downloads) {
      try {
        await downloads.save({ filename: 'lotd-2026-my-picks.html', data: doc });
        return;
      } catch (e) {
        if (e && e.code === 'declined') return;
        // fall through to the window.open fallback below
      }
    }

    // Fallback for contexts without the downloads capability: open the
    // printable page in a new tab so the browser's own print dialog works.
    const win = window.open('', '_blank');
    if (win) {
      win.document.write(doc);
      win.document.close();
    } else {
      alert('Could not open the printable page. Please allow pop-ups and try again.');
    }
  }

  // --- Static toolbar controls (bound once; these elements are never recreated) ---
  mainTabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.main-tab');
    if (!btn) return;
    state.view = btn.dataset.view;
    if (state.view !== 'venues') state.selectedVenue = null;
    hideClashPopover();
    render();
  });

  dayNav.addEventListener('click', (e) => {
    const btn = e.target.closest('.day-btn');
    if (!btn) return;
    state.view = 'day';
    state.day = btn.dataset.day;
    hideClashPopover();
    render();
  });

  layoutToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-layout]');
    if (!btn || btn.dataset.layout === state.layout) return;
    state.layout = btn.dataset.layout;
    try { localStorage.setItem(LAYOUT_KEY, state.layout); } catch (err) { /* not persisted */ }
    hideClashPopover();
    render();
  });

  list.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tt-block')) {
      e.preventDefault();
      showTimetablePopover(e.target);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !clashPopover.hidden) hideClashPopover();
  });

  shareBtn.addEventListener('click', () => {
    state.view = state.view === 'share' ? 'day' : 'share';
    render();
  });
  printBtn.addEventListener('click', handlePrintClick);

  searchInput.addEventListener('input', (e) => {
    state.query = e.target.value.toLowerCase();
    render();
  });
  genreSel.addEventListener('change', (e) => {
    state.genre = e.target.value;
    render();
  });
  resetBtn.addEventListener('click', () => {
    if (!confirm('Clear all starred acts?')) return;
    picks = {};
    backups = {};
    savePicks(picks);
    saveBackups();
    render();
  });

  // --- Delegated handler for the dynamic list container ---
  // One listener handles every row, star button, clash-finder block, and
  // share-copy button, regardless of how many times render() has redrawn
  // the DOM underneath it — no per-element listeners to re-bind.
  list.addEventListener('click', (e) => {
    const copyBtn = e.target.closest('.share-copy-btn');
    if (copyBtn) {
      const input = document.getElementById(copyBtn.dataset.target);
      input.focus();
      input.select();
      input.setSelectionRange(0, 99999);
      attemptCopy(input.value, copyBtn);
      return;
    }

    const ttBlock = e.target.closest('.tt-block');
    if (ttBlock) {
      showTimetablePopover(ttBlock);
      return;
    }

    const clashBlock = e.target.closest('.clash-block');
    if (clashBlock) {
      showClashPopover(clashBlock);
      return;
    }

    const venueNode = e.target.closest('.venue-node');
    if (venueNode) {
      state.selectedVenue = venueNode.dataset.key;
      render();
      scrollVenueDetailIntoView();
      return;
    }

    const venueTableRow = e.target.closest('.venue-table-row');
    if (venueTableRow) {
      state.selectedVenue = venueTableRow.dataset.key;
      render();
      scrollVenueDetailIntoView();
      return;
    }

    const resolveBtn = e.target.closest('.resolve-btn[data-resolve]');
    if (resolveBtn) {
      if (resolveBtn.dataset.resolve === 'backup') setBackup(resolveBtn.dataset.id);
      else setPrimary(resolveBtn.dataset.id);
      render();
      return;
    }

    const nowStar = e.target.closest('.now-star');
    if (nowStar) {
      picks[nowStar.dataset.actidx] = 'want';
      savePicks(picks);
      render();
      return;
    }

    const removePickBtn = e.target.closest('.remove-pick-btn');
    if (removePickBtn) {
      removePick(removePickBtn.dataset.actidx);
      render();
      return;
    }

    const starBtn = e.target.closest('.star-btn');
    if (starBtn) {
      const actIdx = starBtn.closest('.row').dataset.actidx;
      const next = cyclePriority(picks[actIdx] || null);
      picks[actIdx] = next;
      savePicks(picks);
      render();
      return;
    }

    const row = e.target.closest('.row');
    if (row) {
      const id = row.dataset.id;
      state.open[id] = !state.open[id];
      render();
    }
  });


  // During the festival, open straight on Now/Next and keep it ticking.
  if (liveMoment() && !sharedPicks) state.view = 'now';
  setInterval(() => {
    if (state.view === 'now') render();
  }, 30000);

  render();
})();
</script>
